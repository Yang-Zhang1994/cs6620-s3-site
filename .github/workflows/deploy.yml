name: Deploy site to S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp page with commit and time
        run: |
          sed -i "s/__SHA__/${GITHUB_SHA::7}/; s/__TIME__/$(date -u '+%Y-%m-%d %H:%M UTC')/" site/index.html

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy (replaces manual upload in the S3 console)
        run: aws s3 sync ./site s3://samuel-zhang-mysite-2026 --delete
